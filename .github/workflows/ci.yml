name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short

      - name: Check for syntax errors (py compile)
        run: |
          python -m py_compile app/main_app.py
          python -m py_compile app/main_app_gui.py
          python -m py_compile fitness_api/main.py
          python -m py_compile scripts/train_model.py
          python -m py_compile shared/constants.py
          python -m py_compile shared/utils.py
          echo "All files passed syntax check."
